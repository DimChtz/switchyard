<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:26px;background:#0B0C0E;border-top:1px solid #1F2126;display:flex;align-items:center;gap:16px;padding:0 12px;font:11.5px 'Geist Mono',ui-monospace,monospace;color:#6E717A;box-sizing:border-box;white-space:nowrap">
  <span style="color:#5A5D66">agents</span>
  <div style="display:flex;align-items:center;gap:14px;flex:1;min-width:0;overflow:hidden">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="8">
      <span style="display:flex;align-items:center;gap:6px;color:{{ i.fg }}"><span style="width:6px;height:6px;border-radius:50%;background:{{ i.dot }}"></span>{{ i.name }}</span>
    </sc-for>
  </div>
  <span style="color:#A4A7AE">{{ context }}</span>
  <span>⌘K</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:26},&quot;context&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;main&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const C = { working: '#6BCB8B', waiting: '#E3B25A', failed: '#E86A5F', done: '#5A5D66' };
    const items = [
      ['session-refresh', 'failed'], ['search-ranking', 'waiting'], ['rds-pg16', 'waiting'],
      ['checkout', 'working'], ['rate-limit', 'working'], ['expo-router', 'working'],
      ['emails ✓', 'done'], ['team-invites ✓', 'done']
    ].map(([name, s]) => ({ name, dot: C[s], fg: s === 'failed' || s === 'waiting' ? C[s] : '#8A8D95' }));
    return { items, context: this.props.context ?? 'main' };
  }
}
</script>
</body>
</html>
